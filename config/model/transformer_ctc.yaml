# @package _global_
module:
  _target_: emg2qwerty.lightning.EncoderCTCModule
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
  mlp_features: [384]
  encoder:
    _target_: emg2qwerty.modules.ChunkedTransformerEncoder
    d_model: 256
    num_layers: 4
    num_heads: 4
    dim_feedforward: 1024
    dropout: 0.1
    chunk_size: 128  # Attention within blocks of 128 frames (about 1 s at 125 Hz)
    context_frames: 124  # Matches TDS baseline: 4 conv blocks x (kernel_width 32 - 1)

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000  # 4 sec windows for 2kHz EMG
  padding: [1800, 200]  # 900ms past context, 100ms future context
